<?csp default-src chrome: resource:; object-src 'none'; ?>

<window xmlns:html="http://www.w3.org/1999/xhtml"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        id="aboutDialog"
        windowtype="Browser:About"
#ifndef XP_MACOSX
        title="About Comper Browser Pro Lite Edition"
#endif
        role="dialog"
        aria-describedby="version distribution distributionId communityDesc trademark"
        >
#ifdef XP_MACOSX
#include macWindow.inc.xhtml
#else
  <script src="chrome://browser/content/utilityOverlay.js"/>
#endif

  <linkset>
    <html:link rel="stylesheet" href="chrome://global/skin/global.css" />
    <html:link
      rel="stylesheet"
      href="chrome://browser/content/aboutDialog.css"
    />
    <html:link
      rel="stylesheet"
      href="chrome://branding/content/aboutDialog.css"
    />

    <html:link rel="localization" href="branding/brand.ftl"/>
    <html:link rel="localization" href="browser/aboutDialog.ftl"/>
  </linkset>

  <html:div id="aboutDialogContainer">
    <hbox id="clientBox">
      <vbox id="leftBox" flex="1"/>
      <vbox id="rightBox">
        <label id="release" style="font-weight: bold; color: #ff9f1c;">
          Comper Browser Pro Lite Edition
        </label>
#ifndef MOZ_UPDATER
        <hbox align="baseline">
          <label id="version"/>
        </hbox>
#endif

        <label id="distribution" class="text-blurb"/>
        <label id="distributionId" class="text-blurb"/>

        <vbox id="detailsBox">
          <hbox id="updateBox">
#ifdef MOZ_UPDATER
            <html:img id="updateIcon" role="presentation"/>
            <vbox id="updateInfo">
              <deck id="updateDeck" orient="vertical">
                <description id="checkForUpdates">
                  <button id="checkForUpdatesButton"
                          label="Check for Updates"/>
                </description>
                <description id="downloadAndInstall">
                  <button id="downloadAndInstallButton"/>
                </description>
                <description id="apply">
                  <button id="updateButton"
                          label="Apply Update and Restart"/>
                </description>
                <description id="checkingForUpdates">Checking for updates...</description>
                <description id="downloading" data-l10n-id="aboutdialog-update-downloading" data-l10n-args='{"transfer":""}'>
                  <label data-l10n-name="download-status"/>
                </description>
                <description id="applying">Applying update...</description>
                <description id="downloadFailed">
                  Update failed. <label id="failedLink" is="text-link" href="https://github.com/tda45/Comper-Browser-Pro-Lite/releases" value="Download manually from GitHub"/>
                </description>
                <description id="policyDisabled">Updates disabled by your administrator.</description>
                <description id="noUpdatesFound">Comper Browser is up to date.</description>
                <description id="checkingFailed">Checking for updates failed.</description>
                <description id="otherInstanceHandlingUpdates">Another instance is handling updates.</description>
                <description id="manualUpdate">
                  Please update manually: <label class="manualLink" is="text-link" href="https://github.com/tda45/Comper-Browser-Pro-Lite/releases" value="GitHub Releases"/>
                </description>
                <description id="unsupportedSystem">Your system does not support this version.</description>
                <description id="restarting">Restarting...</description>
                <description id="internalError">An internal updater error occurred.</description>
                <description id="noUpdater"/>
              </deck>
              <hbox align="baseline">
                <label id="version" class="update"/>
              </hbox>
            </vbox>
#endif
          </hbox>

          <description class="text-blurb" id="communityDesc">
            Comper Browser is developed as open-source by the community.
            <label is="text-link" href="https://github.com/tda45/Comper-Browser-Pro-Lite" value="GitHub Repository"/>
          </description>
        </vbox>
      </vbox>
    </hbox>
    <vbox id="bottomBox">
      <hbox pack="center">
        <label is="text-link" class="bottom-link" useoriginprincipal="true" href="about:license" value="Licensing Information"/>
      </hbox>
      <description id="trademark">Comper Browser Pro Lite is a tda45 project.</description>
    </vbox>
  </html:div>

  <keyset>
    <key id="aboutDialogEscapeKey" keycode="VK_ESCAPE"/>
  </keyset>

  <script src="chrome://browser/content/aboutDialog.js"/>
</window>
