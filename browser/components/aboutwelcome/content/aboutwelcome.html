<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Comper Browser Pro Lite'a Hoş Geldiniz</title>
    <link rel="icon" type="image/png" href="chrome://branding/content/icon32.png" />
    
    <style>
      /* Gece Kırmızısı ve Premium Karanlık Tema Tasarımı */
      body {
        background-color: #140506;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      .welcome-card {
        text-align: center;
        background: rgba(38, 10, 12, 0.4);
        padding: 40px 60px;
        border-radius: 16px;
        border: 1px solid #54181f;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        max-width: 500px;
        animation: fadeIn 1s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .logo-container {
        margin-bottom: 20px;
      }

      .logo-container img {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 0 15px rgba(255, 51, 75, 0.6));
      }

      h1 {
        font-size: 2rem;
        margin: 0 0 10px 0;
        color: #ffffff;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      p {
        color: #d1bcbd;
        font-size: 1.1rem;
        line-height: 1.5;
        margin: 0 0 30px 0;
      }

      .btn-start {
        display: inline-block;
        background-color: #a11826;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .btn-start:hover {
        background-color: #ff334b;
        box-shadow: 0 0 20px rgba(255, 51, 75, 0.4);
        transform: translateY(-2px);
      }

      .btn-start:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>

    <div class="welcome-card">
      <div class="logo-container">
        <img src="chrome://branding/content/about-logo.png" alt="Comper Logo" />
      </div>
      <h1>Comper Browser</h1>
      <p>Pro Lite sürümüne hoş geldiniz. İnternetiniz artık daha hızlı, daha güvenli ve tamamen size özel.</p>
      <a class="btn-start" href="about:blank">Gezinmeye Başla</a>
    </div>

  </body>
</html>
